apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-trading-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-trading-api

  template:
    metadata:
      labels:
        app: ai-trading-api

    spec:
      containers:
        - name: ai-trading-api
          image: ai-trading-system:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: PORT
              value: "8000"

            - name: MODEL_PATH
              value: /app/models/GC/5m/random_forest/random_forest_v3.pkl

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20