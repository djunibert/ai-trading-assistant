name: CD

on:
  workflow_run:
    workflows:
      - CI Python
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Récupérer le code validé
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Générer les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=AI Trading System
            org.opencontainers.image.description=API du système IA de trading
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Construire et publier l'image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé de la publication
        run: |
          echo "### Image Docker publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image : ${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest : ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Déployer sur le serveur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - publish

    if: vars.DEPLOY_ENABLED == 'true'

    environment:
      name: production

    steps:
      - name: Déployer le conteneur par SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_PATH: ${{ vars.MODEL_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,DATABASE_URL,MODEL_PATH
          script_stop: true
          script: |
            set -e

            echo "$GHCR_TOKEN" |
              docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

            docker pull "$IMAGE_NAME:latest"

            docker stop ai-trading-api || true
            docker rm ai-trading-api || true

            docker run -d \
              --name ai-trading-api \
              --restart unless-stopped \
              -p 8000:8000 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e MODEL_PATH="${MODEL_PATH:-/app/models/GC/5m/random_forest/random_forest_v3.pkl}" \
              -v /opt/ai-trading-system/data:/app/data:ro \
              -v /opt/ai-trading-system/models:/app/models:ro \
              "$IMAGE_NAME:latest"

            sleep 10

            curl --fail http://localhost:8000/health

            docker image prune -f